services:
  api:
    network_mode: host
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    command: ["bun", "dist/index.js"]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e "fetch('http://127.0.0.1:3000/health/ready').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    network_mode: host
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    command: ["bun", "dist/worker.js"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy

  web:
    network_mode: host
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    env_file:
      - .env
    restart: unless-stopped
    command: ["bun", "run", "start"]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  proxy:
    network_mode: host
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.100.1
    network_mode: host
    environment:
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    volumes:
      - n8n_data:/home/node/.n8n
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
